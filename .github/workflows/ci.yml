name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: pytest
        run: pytest -q

      - name: ruff lint
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy ares tests

      - name: package import smoke test
        run: python -c "import ares; from ares.models import Entity, Fact, Thesis; from ares.pipeline import ResearchPipeline; print('ares', ares.__version__)"

      - name: CLI smoke test
        run: |
          ares analyze NVDA --json > /dev/null
          ares analyze NVDA | grep -q "WARNING"
